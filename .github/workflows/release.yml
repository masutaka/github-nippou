name: Release

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - Test
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}

jobs:
  tagpr:
    # (1) Create a release pull request.
    #     e.g. https://github.com/masutaka/github-nippou/pull/132
    # (2) If the pull request exists, update it.
    # (3) If the pull request is merged, create a new git tag.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.CI_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - id: run-tagpr
        uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
    outputs:
      tagpr-tag: ${{ steps.run-tagpr.outputs.tag }}
  release:
    # When (3) above, the if condition is satisfied.
    # The github-nippou binaries are built and uploaded to GitHub release.
    if: needs.tagpr.outputs.tagpr-tag != ''
    needs: tagpr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
      - name: Setup Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false
      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          install-only: true
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: "masutaka"
          repositories: "homebrew-tap"
          permission-contents: write
      - name: Release
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-checksums: ./dist/github-nippou_${{ needs.tagpr.outputs.tagpr-tag }}_checksums.txt
  pushover:
    name: pushover if failure
    if: failure()
    needs: [release]
    uses: masutaka/actions/.github/workflows/pushover.yml@main
    permissions: {}
    secrets:
      PUSHOVER_API_KEY: ${{ secrets.PUSHOVER_API_KEY }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
