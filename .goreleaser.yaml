version: 2

before:
  hooks:
    - go mod download
    - go mod tidy

builds:
  - id: github-nippou-darwin
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./main.go
  - id: github-nippou-linux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./main.go
  - id: github-nippou-windows
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    main: ./main.go

archives:
  - formats: [ "zip" ]
    name_template: '{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    files:
      - CHANGELOG.md
      - LICENSE.txt
      - README.md

checksum:
  name_template: '{{ .ProjectName }}_v{{ .Version }}_checksums.txt'

release:
  use_existing_draft: true

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: github-nippou
    repository:
      owner: masutaka
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: "github-actions[bot]"
      email: "github-actions[bot]@users.noreply.github.com"
    homepage: "https://github.com/masutaka/github-nippou"
    description: "Print today's your GitHub activity for issues and pull requests"
    url:
      verified: github.com/masutaka/github-nippou/
    hooks:
      pre:
        # Casks quarantine their downloads, and this binary is neither signed
        # nor notarized, so it cannot run until the bit is cleared. This has to
        # be a preflight hook: Homebrew orders cask artifacts by class, and
        # generate_completions_from_executable runs the binary before any
        # postflight hook fires.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/github-nippou"]
          end
    generate_completions_from_executable:
      shell_parameter_format: cobra
